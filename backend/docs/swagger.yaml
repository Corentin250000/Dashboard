host: 127.0.0.1:8080
info:
  contact: {}
  description: API for the Dashboard services, widgets, and user accounts.
  title: Dashboard API
  version: "1.0"
paths:
  /:
    get:
      description: Return a pointer to the API catalog.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.RootResponse'
      summary: API root
      tags:
      - system
  /about.json:
    get:
      description: Return the available services and widgets for dashboard clients.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/about.Response'
      summary: Service catalog
      tags:
      - system
  /api/me/account:
    delete:
      description: Permanently delete the authenticated user's account, sessions,
        service connections, and dashboard widgets. The session cookie is cleared
        after successful deletion.
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted.
          schema:
            $ref: '#/definitions/auth.DeleteAccountSuccessResponse'
        "401":
          description: Missing, expired, or invalid session.
          schema:
            $ref: '#/definitions/auth.SessionUnauthorizedResponse'
        "500":
          description: Unable to delete the account.
          schema:
            $ref: '#/definitions/auth.DeleteAccountErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/auth.DeleteAccountUnavailableResponse'
      summary: Delete account
      tags:
      - auth
  /api/me/services:
    get:
      description: Return every catalog service, whether it requires a third-party
        connection, whether the current user is connected, and its available widget
        sizes.
      produces:
      - application/json
      responses:
        "200":
          description: Service catalog with per-user connection status.
          schema:
            $ref: '#/definitions/widgets.ServicesResponse'
        "401":
          description: The session_id cookie is missing, expired or invalid.
          schema:
            $ref: '#/definitions/widgets.ServiceUnauthorizedResponse'
        "500":
          description: The service catalog or the user's connection statuses could
            not be loaded.
          schema:
            $ref: '#/definitions/widgets.ServiceServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.ServiceUnavailableResponse'
      summary: List services
      tags:
      - services
  /api/me/services/{service}/callback:
    get:
      description: Complete the Spotify or Google OAuth 2.0 or Steam OpenID 2.0 flow,
        encrypt the received OAuth tokens (or store the Steam account identifier),
        upsert the current user's service connection, then redirect to the frontend
        subscription page.
      parameters:
      - description: Service technical name
        enum:
        - spotify
        - google
        - steam
        in: path
        name: service
        required: true
        type: string
      - description: OAuth state returned by Spotify; Steam OpenID does not return
          this parameter
        in: query
        name: state
        type: string
      - description: Authorization code returned by the provider
        in: query
        name: code
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Connection stored; redirect to the frontend /subscription page.
        "400":
          description: The state does not match the service OAuth cookie, or the temporary
            OAuth session expired/cannot be decoded.
          schema:
            $ref: '#/definitions/widgets.ServiceOAuthStateResponse'
        "401":
          description: The current Dashboard session is missing, expired or invalid.
          schema:
            $ref: '#/definitions/widgets.ServiceUnauthorizedResponse'
        "404":
          description: The service is not present in the catalog, or no Goth service
            provider is registered.
          schema:
            $ref: '#/definitions/widgets.ServiceNotFoundResponse'
        "500":
          description: The service tokens could not be encrypted, loaded or persisted.
          schema:
            $ref: '#/definitions/widgets.ServiceServerErrorResponse'
        "502":
          description: Spotify/Steam rejected authorization, or the provider profile
            could not be retrieved.
          schema:
            $ref: '#/definitions/widgets.ServiceOAuthProviderResponse'
      summary: Complete service connection
      tags:
      - services
  /api/me/services/{service}/connect:
    get:
      description: Start a third-party connection for Spotify, Google (OAuth 2.0)
        or Steam (OpenID 2.0 via Goth). GitHub remains reserved for application login.
        The browser is redirected to the provider; the callback stores encrypted tokens
        or the Steam account identifier for the current user.
      parameters:
      - description: Service technical name
        enum:
        - spotify
        - google
        - steam
        in: path
        name: service
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the selected service OAuth 2.0 or Steam OpenID
            2.0 authorization page.
        "400":
          description: The selected service has auth_type=none and does not need a
            connection.
          schema:
            $ref: '#/definitions/widgets.ServiceBadRequestResponse'
        "401":
          description: The session_id cookie is missing, expired or invalid.
          schema:
            $ref: '#/definitions/widgets.ServiceUnauthorizedResponse'
        "404":
          description: The service is not present in the catalog, or no Goth provider
            is registered for it.
          schema:
            $ref: '#/definitions/widgets.ServiceNotFoundResponse'
        "500":
          description: The OAuth state, provider authorization URL or OAuth session
            could not be created.
          schema:
            $ref: '#/definitions/widgets.ServiceServerErrorResponse'
        "503":
          description: The database or the service OAuth credentials are not configured.
          schema:
            $ref: '#/definitions/widgets.ServiceUnavailableResponse'
      summary: Connect a service
      tags:
      - services
  /api/me/services/{service}/connection:
    delete:
      description: Delete the current user's local service connection and its encrypted
        tokens. Also removes that service's dashboard widget instances. Provider-side
        token revocation is not generic and may require a provider-specific implementation.
      parameters:
      - description: Service technical name (spotify or steam)
        enum:
        - spotify
        - steam
        in: path
        name: service
        required: true
        type: string
      responses:
        "204":
          description: Connection, encrypted tokens and the user's widgets for this
            service deleted; empty response body.
        "401":
          description: The session_id cookie is missing, expired or invalid.
          schema:
            $ref: '#/definitions/widgets.ServiceUnauthorizedResponse'
        "404":
          description: The service is not present in the catalog.
          schema:
            $ref: '#/definitions/widgets.ServiceNotFoundResponse'
        "500":
          description: The service connection or associated widget instances could
            not be deleted.
          schema:
            $ref: '#/definitions/widgets.ServiceDisconnectErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.ServiceUnavailableResponse'
      summary: Disconnect a service
      tags:
      - services
  /api/me/widgets:
    get:
      description: Return every widget instance placed on the dashboard of the current
        user, ordered by creation date. Requires the session_id cookie.
      produces:
      - application/json
      responses:
        "200":
          description: The dashboard widgets of the current user.
          schema:
            $ref: '#/definitions/widgets.WidgetInstanceListResponse'
        "401":
          description: Missing, expired or invalid session cookie.
          schema:
            $ref: '#/definitions/widgets.WidgetUnauthorizedResponse'
        "500":
          description: Unable to load widgets.
          schema:
            $ref: '#/definitions/widgets.WidgetServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.WidgetUnavailableResponse'
      summary: List dashboard widgets
      tags:
      - widgets
    post:
      consumes:
      - application/json
      description: Create a widget instance. The type must use the "service.widget"
        format (e.g. "sncf.departures"), the size must be allowed for that widget,
        the refresh rate must be between 60 and 21600 seconds, and the position is
        the zero-based top-left cell on the 6x6 desktop grid. The new widget must
        fit inside the grid without overlapping an existing widget.
      parameters:
      - description: Widget to create (type, size, config, refresh_rate_seconds, position)
        in: body
        name: widget
        required: true
        schema:
          $ref: '#/definitions/widgets.CreateWidgetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created widget instance.
          schema:
            $ref: '#/definitions/widgets.WidgetInstanceResponse'
        "400":
          description: Malformed JSON body or missing type, size, refresh_rate_seconds
            or position.
          schema:
            $ref: '#/definitions/widgets.WidgetBadRequestResponse'
        "401":
          description: Missing, expired or invalid session cookie.
          schema:
            $ref: '#/definitions/widgets.WidgetUnauthorizedResponse'
        "404":
          description: Unknown widget type (unknown service, unknown widget, or malformed
            type string).
          schema:
            $ref: '#/definitions/widgets.WidgetTypeNotFoundResponse'
        "409":
          description: The new widget overlaps another widget of the dashboard.
          schema:
            $ref: '#/definitions/widgets.WidgetConflictResponse'
        "422":
          description: Size not allowed for this widget, refresh rate outside the
            60-21600 second range, invalid config parameter, or position outside the
            6x6 grid.
          schema:
            $ref: '#/definitions/widgets.WidgetUnprocessableResponse'
        "500":
          description: Unable to create the widget.
          schema:
            $ref: '#/definitions/widgets.WidgetServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.WidgetUnavailableResponse'
      summary: Create a dashboard widget
      tags:
      - widgets
  /api/me/widgets/{id}:
    delete:
      description: Delete a widget instance from the dashboard of the current user.
        Only the instance is removed; the widget catalog entry and the other widgets
        are untouched. Returns an empty body.
      parameters:
      - description: Widget instance ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: The widget was deleted (empty body).
        "400":
          description: The widget ID is not a valid UUID.
          schema:
            $ref: '#/definitions/widgets.WidgetInvalidIDResponse'
        "401":
          description: Missing, expired or invalid session cookie.
          schema:
            $ref: '#/definitions/widgets.WidgetUnauthorizedResponse'
        "404":
          description: No widget with this ID on the dashboard of the current user.
          schema:
            $ref: '#/definitions/widgets.WidgetInstanceNotFoundResponse'
        "500":
          description: Unable to delete the widget.
          schema:
            $ref: '#/definitions/widgets.WidgetServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.WidgetUnavailableResponse'
      summary: Delete a dashboard widget
      tags:
      - widgets
    patch:
      consumes:
      - application/json
      description: 'Update any subset of size, config, refresh rate or position. Omitted
        fields are left unchanged. The widget type cannot be changed. After applying
        the patch, the whole dashboard layout is revalidated: the widget must fit
        inside the 6x6 desktop grid without overlapping another widget.'
      parameters:
      - description: Widget instance ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (only non-null fields are applied)
        in: body
        name: widget
        required: true
        schema:
          $ref: '#/definitions/widgets.UpdateWidgetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated widget instance.
          schema:
            $ref: '#/definitions/widgets.WidgetInstanceResponse'
        "400":
          description: Malformed widget ID, malformed JSON body, or empty patch (no
            updatable field provided).
          schema:
            $ref: '#/definitions/widgets.WidgetBadRequestResponse'
        "401":
          description: Missing, expired or invalid session cookie.
          schema:
            $ref: '#/definitions/widgets.WidgetUnauthorizedResponse'
        "404":
          description: No widget with this ID on the dashboard of the current user.
          schema:
            $ref: '#/definitions/widgets.WidgetInstanceNotFoundResponse'
        "409":
          description: The updated widget would overlap another widget of the dashboard.
          schema:
            $ref: '#/definitions/widgets.WidgetConflictResponse'
        "422":
          description: Size not allowed for this widget, refresh rate outside the
            60-21600 second range, invalid config parameter, or position outside the
            6x6 grid.
          schema:
            $ref: '#/definitions/widgets.WidgetUnprocessableResponse'
        "500":
          description: Unable to update the widget.
          schema:
            $ref: '#/definitions/widgets.WidgetServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/widgets.WidgetUnavailableResponse'
      summary: Update a dashboard widget
      tags:
      - widgets
  /api/sncf/departures:
    post:
      consumes:
      - application/json
      description: 'Returns the next 10 departures (scheduled time, real time, destination,
        delay in minutes, cancellation flag) for a station. The station name is matched
        exactly against the SNCF stop_areas catalog. Public route: no authentication
        required.'
      parameters:
      - description: Station name exactly as listed in the SNCF catalog (e.g. Paris
          Gare du Nord)
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/widgets.TrainStationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Up to 10 upcoming departures, earliest first.
          schema:
            $ref: '#/definitions/widgets.SncfDeparturesResponse'
        "400":
          description: Malformed JSON body or missing/empty text field.
          schema:
            $ref: '#/definitions/widgets.SncfBadRequestResponse'
        "404":
          description: No station with this exact name in the SNCF catalog.
          schema:
            $ref: '#/definitions/widgets.SncfNotFoundResponse'
        "500":
          description: Station lookup or SNCF request construction failed.
          schema:
            $ref: '#/definitions/widgets.SncfServerErrorResponse'
        "502":
          description: SNCF API unreachable, non-2xx response, or invalid payload.
          schema:
            $ref: '#/definitions/widgets.SncfBadGatewayResponse'
        "503":
          description: API_KEY_SNCF is not set on the server.
          schema:
            $ref: '#/definitions/widgets.SncfUnavailableResponse'
      summary: SNCF departures
      tags:
      - SNCF
  /api/sncf/journeys:
    post:
      consumes:
      - application/json
      description: 'Searches up to five train journeys between two SNCF stations for
        a local departure datetime. Station names are matched exactly against the
        SNCF stop_areas catalog. If Navitia has no solution, the endpoint returns
        200 with an empty journeys array. Public route: no authentication required.'
      parameters:
      - description: Journey search request.
        in: body
        name: journey
        required: true
        schema:
          $ref: '#/definitions/widgets.JourneyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Up to five journeys.
          schema:
            $ref: '#/definitions/widgets.SncfJourneysResponse'
        "400":
          description: Malformed JSON body, missing from/to/datetime field, or datetime
            not formatted as YYYY-MM-DDTHH:mm.
          schema:
            $ref: '#/definitions/widgets.SncfBadRequestResponse'
        "404":
          description: The departure or arrival station is not present in the SNCF
            catalog.
          schema:
            $ref: '#/definitions/widgets.SncfNotFoundResponse'
        "500":
          description: The station catalog could not be queried.
          schema:
            $ref: '#/definitions/widgets.SncfServerErrorResponse'
        "502":
          description: SNCF API unreachable, non-2xx response, or invalid payload.
          schema:
            $ref: '#/definitions/widgets.SncfBadGatewayResponse'
        "503":
          description: The database or API_KEY_SNCF is not configured.
          schema:
            $ref: '#/definitions/widgets.SncfUnavailableResponse'
      summary: SNCF journeys
      tags:
      - SNCF
  /api/spotify/currently-playing:
    get:
      description: Returns the track currently playing for the authenticated Spotify
        account. When playback is stopped, when no track is active, or when Spotify
        returns a podcast episode, the response is {"playing":false}.
      produces:
      - application/json
      responses:
        "200":
          description: Current track, or playing=false when no supported track is
            active.
          schema:
            $ref: '#/definitions/widgets.CurrentlyPlayingResponse'
        "401":
          description: Spotify must be reconnected because the token is invalid, revoked,
            or lacks the required scope.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "403":
          description: The current user is not subscribed to Spotify.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "429":
          description: Spotify rate limit reached; Retry-After is returned when provided
            by Spotify.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "502":
          description: Spotify is unavailable or returned an invalid response.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
      summary: Spotify currently playing
      tags:
      - Spotify widgets
  /api/spotify/top:
    get:
      description: 'Returns the authenticated user''s top Spotify artists or tracks.
        Example: /api/spotify/top?item_type=tracks&time_range=long_term&limit=5. If
        time_range is omitted, medium_term is used.'
      parameters:
      - description: Top item type
        enum:
        - artists
        - tracks
        example: tracks
        in: query
        name: item_type
        required: true
        type: string
      - default: medium_term
        description: Time range used by Spotify
        enum:
        - short_term
        - medium_term
        - long_term
        example: medium_term
        in: query
        name: time_range
        type: string
      - default: 5
        description: Number of items
        example: 5
        in: query
        maximum: 10
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ranked top artists or tracks.
          schema:
            $ref: '#/definitions/widgets.SpotifyTopResponse'
        "400":
          description: A query parameter is missing or invalid.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "401":
          description: Spotify must be reconnected because the token is invalid, revoked,
            or lacks the required scope.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "403":
          description: The current user is not subscribed to Spotify.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "429":
          description: Spotify rate limit reached; Retry-After is returned when provided
            by Spotify.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
        "502":
          description: Spotify is unavailable or returned an invalid response.
          schema:
            $ref: '#/definitions/widgets.spotifyErrorResponse'
      summary: Spotify top items
      tags:
      - Spotify widgets
  /api/steam/friends/status:
    post:
      consumes:
      - application/json
      description: Search the connected user's Steam friends with a normalized pseudo.
        The local friend list is synchronized after Steam connection and refreshed
        when its data is older than two minutes. Directional Unicode control characters
        are removed only for searching; the original Steam pseudo is returned unchanged.
      parameters:
      - description: Pseudo to search (1 to 64 Unicode characters)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/widgets.SteamFriendStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Matching friends, limited to 10 results. Exact normalized
            matches are returned first. Example: {\"results\":[{\"steamId\":\"76561198978982665\",\"pseudo\":\"chrystoval\\u2067\\u2067♛\",\"profileVisibility\":\"public\",\"profileConfigured\":true,\"status\":\"En
            ligne\",\"currentGame\":{\"id\":\"730\",\"name\":\"Counter-Strike 2\"},\"lastLogoff\":\"2026-10-05T19:51:31Z\"}]}'
          schema:
            $ref: '#/definitions/widgets.SteamFriendStatusResponse'
        "400":
          description: Malformed JSON, empty pseudo, or pseudo longer than 64 Unicode
            characters.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsBadRequestResponse'
        "401":
          description: The session_id cookie is missing, expired or invalid.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsUnauthorizedResponse'
        "403":
          description: The Steam account is not connected or the Steam friend list
            is private.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsPrivateResponse'
        "500":
          description: The local Steam friends data could not be searched or refreshed.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsServerResponse'
        "502":
          description: Steam is unreachable, timed out, returned an unexpected status,
            or returned an invalid response.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsBadGatewayResponse'
        "503":
          description: The Steam friends service is not configured.
          schema:
            $ref: '#/definitions/widgets.SteamFriendsUnavailableResponse'
      summary: Search a Steam friend's status
      tags:
      - Steam
  /auth/{provider}:
    get:
      description: Start an OAuth authentication flow for a supported provider. Sets
        two short-lived HTTP-only cookies (OAuth state and session, 10 minutes) then
        redirects the browser (302) to the provider's consent page. The frontend must
        navigate to this URL directly (full page load), not via fetch, so cookies
        and redirects work.
      parameters:
      - description: OAuth provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the provider consent page.
        "404":
          description: Unknown provider name (only google and github are supported).
          schema:
            $ref: '#/definitions/auth.OAuthProviderNotFoundResponse'
        "500":
          description: Unable to start OAuth login or to build the provider URL.
          schema:
            $ref: '#/definitions/auth.OAuthStartErrorResponse'
        "503":
          description: Provider credentials (CLIENT_ID_<PROVIDER> / CLIENT_SECRET_<PROVIDER>)
            are missing.
          schema:
            $ref: '#/definitions/auth.OAuthNotConfiguredResponse'
      summary: Start OAuth authentication
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      description: 'Handle the provider callback: verify the state cookie, exchange
        the authorization code, fetch the provider profile, then create or retrieve
        the local user (OAuth accounts are auto-confirmed, no email verification needed).
        Persists a 7-day session in the database, sets the HTTP-only session_id cookie,
        and redirects (302) to the frontend dashboard. On failure returns JSON instead
        of redirecting.'
      parameters:
      - description: OAuth provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth state returned by the provider (must match the oauth_state_<provider>
          cookie)
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code returned by the provider
        in: query
        name: code
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 'Authenticated: redirect to the frontend dashboard with the
            session_id cookie set.'
        "400":
          description: State mismatch, expired OAuth cookies, or provider returned
            no email address.
          schema:
            $ref: '#/definitions/auth.OAuthInvalidStateResponse'
        "404":
          description: Unknown provider name (only google and github are supported).
          schema:
            $ref: '#/definitions/auth.OAuthProviderNotFoundResponse'
        "500":
          description: Local account creation, session persistence, or redirect target
            failed.
          schema:
            $ref: '#/definitions/auth.OAuthAccountErrorResponse'
        "502":
          description: Code exchange or profile fetch failed at the provider.
          schema:
            $ref: '#/definitions/auth.OAuthAuthorizationFailedResponse'
      summary: Complete OAuth authentication
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password. On success persists
        a 7-day session in the database and sets the HTTP-only session_id cookie (SameSite
        Lax). OAuth-only accounts (no local password) cannot use this route.
      parameters:
      - description: Login credentials (valid email + password)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Authenticated: session cookie set.'
          schema:
            $ref: '#/definitions/auth.LoginSuccessResponse'
        "400":
          description: Malformed JSON body, missing fields, or invalid email format.
          schema:
            $ref: '#/definitions/auth.LoginBadRequestResponse'
        "401":
          description: Unknown email, wrong password, or account without local password
            (use OAuth instead).
          schema:
            $ref: '#/definitions/auth.LoginUnauthorizedResponse'
        "403":
          description: Account created but email not confirmed yet (check /confirm).
          schema:
            $ref: '#/definitions/auth.LoginUnconfirmedResponse'
        "500":
          description: Password comparison or session creation failed.
          schema:
            $ref: '#/definitions/auth.LoginServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/auth.LoginUnavailableResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Delete the current session from the database and clear the HTTP-only
        session_id cookie. Third-party service tokens (user_services) are kept: disconnecting
        a service is a separate operation.'
      produces:
      - application/json
      responses:
        "200":
          description: The session was revoked and the cookie cleared.
          schema:
            $ref: '#/definitions/auth.LogoutSuccessResponse'
        "401":
          description: Missing session cookie, or expired/invalid session (cookie
            is cleared).
          schema:
            $ref: '#/definitions/auth.SessionUnauthorizedResponse'
        "500":
          description: Unable to log out (database error).
          schema:
            $ref: '#/definitions/auth.SessionErrorResponse'
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: Return the id and email of the account associated with the current
        browser session. Used by the frontend on page load to decide whether to show
        "Log in" or "Log out". Requires the session_id cookie.
      produces:
      - application/json
      responses:
        "200":
          description: The id and email of the authenticated user.
          schema:
            $ref: '#/definitions/auth.CurrentUserResponse'
        "401":
          description: Missing session cookie, or expired/invalid session (cookie
            is cleared).
          schema:
            $ref: '#/definitions/auth.SessionUnauthorizedResponse'
        "500":
          description: Unable to validate session.
          schema:
            $ref: '#/definitions/auth.SessionErrorResponse'
      summary: Current user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a user account with email and password (minimum 8 characters).
        The account stays unconfirmed until the emailed token is validated via GET
        /confirm, and login is blocked meanwhile. No authenticated session is created
        here; a temporary HTTP-only pending_confirmation cookie is set so the browser
        can call POST /confirm/resend without a body.
      parameters:
      - description: Registration credentials (valid email + password of at least
          8 characters)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'Account created: check the inbox for the confirmation email.'
          schema:
            $ref: '#/definitions/auth.RegisterSuccessResponse'
        "400":
          description: Malformed JSON body, invalid email format, or password shorter
            than 8 characters.
          schema:
            $ref: '#/definitions/auth.RegisterBadRequestResponse'
        "409":
          description: This email address is already registered.
          schema:
            $ref: '#/definitions/auth.RegisterConflictResponse'
        "500":
          description: Password hashing, token generation, or account creation failed.
          schema:
            $ref: '#/definitions/auth.RegisterServerErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/auth.RegisterUnavailableResponse'
      summary: Register
      tags:
      - auth
  /confirm:
    get:
      description: Confirm a user account with the single-use token sent by email
        (valid 24h). The token is consumed on success and a 7-day session is created
        automatically; already-confirmed accounts return "already_confirmed".
      parameters:
      - description: Email confirmation token from the confirmation link
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account confirmed (or already confirmed).
          schema:
            $ref: '#/definitions/auth.ConfirmedResponse'
        "400":
          description: Missing token query parameter.
          schema:
            $ref: '#/definitions/auth.ConfirmBadRequestResponse'
        "404":
          description: Unknown or already-consumed token.
          schema:
            $ref: '#/definitions/auth.InvalidTokenResponse'
        "410":
          description: Token older than 24h (request a new one via POST /confirm/resend).
          schema:
            $ref: '#/definitions/auth.ExpiredResponse'
        "500":
          description: Database error while confirming.
          schema:
            $ref: '#/definitions/auth.ConfirmErrorResponse'
      summary: Confirm email
      tags:
      - auth
  /confirm/resend:
    post:
      consumes:
      - application/json
      description: Rotate the confirmation token of an unconfirmed account and send
        a new confirmation email. Browser clients are identified by the temporary
        HTTP-only pending_confirmation cookie set by POST /auth/register; non-browser
        clients may use the legacy token body. Rate-limited to 3 requests per 15 minutes.
        Already-confirmed accounts return "already_confirmed".
      parameters:
      - description: Optional legacy body for non-browser clients; browser clients
          use the pending_confirmation cookie
        in: body
        name: token
        schema:
          $ref: '#/definitions/auth.ResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New confirmation email queued (or account already confirmed).
          schema:
            $ref: '#/definitions/auth.ResendSuccessResponse'
        "400":
          description: No pending confirmation cookie or token body was provided.
          schema:
            $ref: '#/definitions/auth.ResendBadRequestResponse'
        "404":
          description: No account matches this token (unknown or already consumed).
          schema:
            $ref: '#/definitions/auth.ResendNotFoundResponse'
        "500":
          description: Database error while rotating the token.
          schema:
            $ref: '#/definitions/auth.ResendErrorResponse'
        "503":
          description: The database is not configured.
          schema:
            $ref: '#/definitions/auth.ResendUnavailableResponse'
      summary: Resend confirmation email
      tags:
      - auth
  /health:
    get:
      description: Check whether the API process is responding.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - system
swagger: "2.0"
