name: dashboard

services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dashboard-server:local
    container_name: dashboard-server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8081}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5m
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8080}
    image: dashboard-client:local
    container_name: dashboard-client
    ports:
      - "8081:8081"
    depends_on:
      - server
    restart: unless-stopped

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dashboard-db:local
    container_name: dashboard-db
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dashboard} -d $${POSTGRES_DB:-dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
